name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main

env:
  ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

jobs:
  # ============== FRONTEND ==============
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: ./frontend
      - run: npm run lint
        working-directory: ./frontend

  frontend-test:
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: ./frontend
      - run: npm run test:ci
        working-directory: ./frontend

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: ./frontend
      - run: npm run build
        working-directory: ./frontend

  frontend-deploy:
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel (Dev)
        if: github.ref == 'refs/heads/development'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DEV }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npm install -g vercel && vercel deploy --prod
        working-directory: ./frontend
      - name: Deploy to Vercel (Prod)
        if: github.ref == 'refs/heads/main'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npm install -g vercel && vercel deploy --prod
        working-directory: ./frontend

  # ============== BACKEND ==============
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet format --verify-no-changes --verbosity diagnostic
        working-directory: ./backend

  backend-test:
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore
        working-directory: ./backend
      - name: Run tests
        working-directory: ./backend
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ConnectionStrings__DefaultConnection: Host=localhost;Username=testuser;Password=testpassword;Database=testdb
        run: dotnet test --no-restore --verbosity normal

  backend-build:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore
        working-directory: ./backend
      - run: dotnet build --no-restore --configuration Release
        working-directory: ./backend

  backend-deploy:
    runs-on: ubuntu-latest
    needs: backend-build
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render Deploy (Dev)
        if: github.ref == 'refs/heads/develop'
        run: |
          curl -X POST https://api.render.com/deploy/${{ secrets.RENDER_SERVICE_ID_DEV }}?key=${{ secrets.RENDER_DEPLOY_KEY_DEV }}
      - name: Trigger Render Deploy (Prod)
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST https://api.render.com/deploy/${{ secrets.RENDER_SERVICE_ID_PROD }}?key=${{ secrets.RENDER_DEPLOY_KEY_PROD }}

  backend-migrate:
    runs-on: ubuntu-latest
    needs: backend-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Setup .NET environment
        run: dotnet tool install --global dotnet-ef
      - name: Restore .NET dependencies
        run: dotnet restore
        working-directory: ./backend

      - name: Run EF Core Migrations (Dev)
        if: github.ref == 'refs/heads/develop'
        working-directory: ./backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
        run: dotnet ef database update
      - name: Run EF Core Migrations (Prod)
        if: github.ref == 'refs/heads/main'
        working-directory: ./backend
        env:
          ASPNETCORE_ENVIRONMENT: Production
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
        run: dotnet ef database update
